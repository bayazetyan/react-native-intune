buildscript {
  // The MAM SDK compatibility matrix (SPEC §6.1) is tested as whole rows, not as a
  // mix. The pinned Android tag in sdk-lock.json is 12.4.0, so this is the 12.0.0
  // row: Android 16 (compileSdk 36), Gradle 8.11.1, AGP 8.9.1, Kotlin 2.1.21, Java 17.
  // Mirrored in sdk-versions.json -> toolchain.requires; change both together.
  ext.Intune = [
    kotlinVersion: "2.1.21",
    minSdkVersion: 24,
    compileSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return Intune[prop]
  }

  repositories {
    google()
    // Not jcenter(), which Microsoft's docs still reference — it is read-only/retired.
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.9.1"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

// The MAM Gradle plugin ("com.microsoft.intune.mam") is deliberately NOT applied here.
// It rewrites bytecode across the whole application and every one of its dependencies,
// so it belongs in the consumer's app module. Applying it in this library would rewrite
// only the library, build successfully, and protect nothing — the worst kind of failure.

android {
  namespace "com.reactnativeintune"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")

    // Shipped to consumers, because a release build with R8 fails without them and only
    // a release build does — debug and unminified release both succeed, so an app finds
    // out when it ships. See the file for what each rule is for.
    consumerProguardFiles "consumer-rules.pro"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

// Fetched by scripts/fetch-sdks.mjs into a gitignored vendor/ (SPEC §2.1).
//
// Resolved from projectDir, NOT rootDir. SPEC §12.3 and TODO.md both write
// "$rootDir/../vendor/...", but when this library is autolinked, rootDir is the
// *consumer app's* android/ directory — that path would point at <app>/vendor and
// never resolve. projectDir is this library's own android/ folder, so ../vendor is
// the package root where fetch-sdks writes.
def mamAar = file("$projectDir/../vendor/android/Microsoft.Intune.MAM.SDK.aar")

// Parallel to the raise in RNIntune.podspec: fail with an instruction rather than an
// unresolved-symbol error deep in the Kotlin compile. Scoped to graphs that actually
// compile this library, so `clean` and unrelated tasks are not blocked by a missing
// download.
gradle.taskGraph.whenReady { graph ->
  if (mamAar.exists()) return
  def compiling = graph.allTasks.any {
    it.project == project && it.name.startsWith("compile")
  }
  if (compiling) {
    throw new GradleException(
      "[react-native-intune] The Microsoft Intune App SDK is missing from vendor/android.\n" +
      "  Expected: ${mamAar}\n" +
      "  Run: node node_modules/react-native-intune/scripts/fetch-sdks.mjs"
    )
  }
}

/**
 * The MAM SDK is resolved through a repository rather than as a file.
 *
 * `implementation files(mamAar)` is what Microsoft's guide shows for an *app* module, and
 * in a *library* module AGP rejects it wherever it has to package the library: "Direct
 * local .aar file dependencies are not supported when building an AAR". This used to be
 * worked around by disabling the bundle tasks by name, and that could not be made right
 * across AGP versions — the lint AAR an app's `lintVitalAnalyzeRelease` consumes is built
 * by one of those tasks. Disabling it broke every clean release build on AGP 8.12;
 * leaving it enabled breaks the same build on the AGP of React Native 0.74, which applies
 * the local-.aar rule to the lint AAR too.
 *
 * Resolved from a repository, the SDK is an ordinary module dependency and AGP stops
 * treating this library as a special case anywhere.
 *
 * An Ivy repository with an `[artifact].[ext]` pattern, because it points at the file
 * fetch-sdks already wrote, under the exact name Microsoft distributes —
 * `Microsoft.Intune.MAM.SDK.aar` — with nothing copied or renamed and no metadata to
 * generate. A flat directory would do the same and prints "should be avoided because it
 * doesn't support any meta-data formats" on every consumer's build, naming this library.
 * The version in the coordinate is not in the pattern, so it is informational: the pin in
 * sdk-versions.json, the one fetch-sdks downloaded.
 *
 * The repository has to be visible to the app, not only to this project: the app resolves
 * its runtime classpath with its own repositories, so a repository declared here alone
 * would fail there. It is added to every project and made exclusive to the one module, so
 * nothing else is ever looked up in it and this module is never looked up anywhere else.
 */
def mamVersion = new groovy.json.JsonSlurper()
  .parse(file("$projectDir/../sdk-versions.json")).android.tag
def mamRepoDir = mamAar.parentFile
rootProject.allprojects {
  repositories {
    exclusiveContent {
      forRepository {
        ivy {
          name = "react-native-intune-mam-sdk"
          url = mamRepoDir.toURI()
          patternLayout {
            artifact "[artifact].[ext]"
          }
          metadataSources {
            artifact()
          }
        }
      }
      filter {
        includeModule("react-native-intune", "Microsoft.Intune.MAM.SDK")
      }
    }
  }
}

dependencies {
  implementation "com.facebook.react:react-android"

  implementation("react-native-intune:Microsoft.Intune.MAM.SDK:${mamVersion}@aar")

  // MSAL. Mirrored in sdk-versions.json -> toolchain.msal_android; change both together.
  //
  // Unlike iOS, Microsoft states no required version for Android — the SDK guide says
  // only "integrate MSAL". So this pin is ours, for reproducibility rather than
  // compatibility, and it is exact for the same reason the iOS one is: two MSAL versions
  // in one binary is a failure mode nobody debugs quickly.
  //
  // mavenCentral, never jcenter — Microsoft's own docs still say jcenter in places and it
  // has been read-only for years (CLAUDE.md, Android gotchas).
  // `display-mask` is excluded deliberately. MSAL depends on it for dual-screen Surface
  // Duo layout, and it is published only to Microsoft's own Azure DevOps feed, not Maven
  // Central. MSAL's README tells apps to add that feed — but repositories are declared by
  // the *consumer's* settings.gradle, so a library cannot add one, and requiring every
  // consumer to trust an extra feed is a poor trade for dual-screen support.
  //
  // [verify] whether MSAL degrades cleanly without it, or throws at sign-in on a real
  // device. If it throws, the fallback is documenting the feed for consumers.
  implementation("com.microsoft.identity.client:msal:8.4.2") {
    exclude group: "com.microsoft.device.display"
  }
}
