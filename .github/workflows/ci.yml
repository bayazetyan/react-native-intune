name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

  build-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

# The native build jobs were removed rather than repaired.
#
# They were the create-react-native-library template's, and they could not have worked
# here: neither ran `scripts/fetch-sdks.mjs`, so `vendor/` was empty, the library's own
# Gradle throws on the missing MAM AAR by design, and the iOS build had no xcframework to
# link. Both would have failed on the first push to main.
#
# Repairing them was the wrong trade for now. A green native build proves the code
# compiles, which a local commit already proves via the pre-commit hook — and it cannot
# prove any of what actually breaks in this library: enrollment, policy delivery, PIN
# enforcement, remote wipe. Those need a physical device and a real tenant, and no CI
# runner has either. The cost was ~200 MB of SDK download per run for that.
#
# Bring them back when there is an outside contributor whose changes are not reviewed by
# hand. What they will need:
#
#   1. `node scripts/fetch-sdks.mjs` before building. Both Microsoft repositories are
#      public, so no token is required.
#   2. Checksum verification — sdk-lock.json already carries a SHA-256 per file and the
#      script checks them.
#   3. A cache of vendor/ keyed on sdk-lock.json, or every run re-downloads.
#   4. A line saying enrollment is not covered, so a green run is not read as proof of it.
