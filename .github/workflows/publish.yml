name: Publish

# On a version tag, never on a merge.
#
# Publishing from `push: main` would try to release the same version on every merge — it
# fails once the version exists, and when it does not, it ships whatever landed without
# anyone deciding to release. The tag is the decision; this workflow is the mechanics.
#
# The tag is produced by `yarn release` (release-it), which bumps the version, writes the
# changelog, commits, tags `v<version>` and opens the GitHub release. release-it does not
# publish to npm — that happens here, so a release cannot come from a laptop with whatever
# happened to be in its working tree.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v0.1.0'
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for npm provenance, which signs the package against this workflow run.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Registry auth
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      # A tag that disagrees with package.json publishes a version nobody asked for, under
      # a tag that then points at the wrong commit forever.
      - name: Tag must match package.json
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          pkg="v$(node -p "require('./package.json').version")"
          echo "tag=$tag  package.json=$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag $tag does not match $pkg"; exit 1; }

      - name: Checks
        run: |
          yarn lint
          yarn typecheck
          yarn test

      - name: Build
        run: yarn prepare

      # The one guard that matters. The Intune App SDK is Microsoft's, under Microsoft's
      # terms, and a tarball containing it is a licensing problem rather than a packaging
      # bug — it cannot be unpublished cleanly once it is on the registry.
      - name: The tarball must not contain the SDK or anything private
        run: |
          # `prepare` writes to stdout ahead of the JSON and --ignore-scripts does not
          # suppress it, so the payload is taken from the first line that opens the array.
          npm pack --dry-run --json > /tmp/raw.json
          sed -n '/^\[/,$p' /tmp/raw.json > /tmp/pack.json
          node -e '
            const files = require("/tmp/pack.json")[0].files.map((f) => f.path);
            const forbidden = files.filter((f) =>
              /^vendor\//.test(f) ||
              /\.(xcframework|aar)(\/|$)/.test(f) ||
              /^(SPEC|TODO)\.md$/.test(f) ||
              /tenant\.json$/.test(f) ||
              /^website\//.test(f)
            );
            if (forbidden.length) {
              console.error("::error::these must never be published:\n  " + forbidden.join("\n  "));
              process.exit(1);
            }
            console.log(`tarball: ${files.length} files, none forbidden`);
          '

      # A prerelease must not become what `npm install <pkg>` hands people. npm assigns
      # `latest` by default — including on a package's very first publish, prerelease or
      # not — so the dist-tag is derived from the version rather than left to the default.
      - name: Choose the dist-tag
        id: disttag
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) tag=next ;;   # 0.1.0-alpha.1, 1.0.0-rc.2 — reachable only on request
            *)   tag=latest ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publishing $version under dist-tag $tag"

      - name: Publish
        # Provenance needs a public repository. While the repository is private the
        # package still publishes, just unsigned, rather than failing the release.
        run: |
          args="--access public --tag ${{ steps.disttag.outputs.tag }}"
          if [ "${{ github.event.repository.private }}" = "false" ]; then
            args="$args --provenance"
          else
            echo "::warning::repository is private — publishing without provenance"
          fi
          echo "npm publish $args"
          npm publish $args
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
