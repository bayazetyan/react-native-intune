pre-commit:
  parallel: true
  commands:

    lint:
      glob: "*.{js,ts,jsx,tsx}"
      # --no-warn-ignored because the staged files are passed explicitly: eslint then
      # reports every ignored one — the whole documentation site, on any commit that
      # touches it — as a warning about its own ignore list.
      run: npx eslint --no-warn-ignored {staged_files}

    types:
      # The typo in the previous glob (`ts, jsx`) meant .jsx and .tsx never triggered it.
      glob: "*.{js,ts,jsx,tsx}"
      run: npx tsc
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: npx commitlint --edit
